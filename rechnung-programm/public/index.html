<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Rechnung-Programm</title>
    <meta name="theme-color" content="#101012" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="img/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@400;600;700&family=Lato:wght@400;700&family=Poppins:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/dokument.css" />
    <link rel="icon" href="img/icon-192.png" />
  </head>
  <body>
    <a class="sprungmarke" href="#main">Zum Inhalt springen</a>
    <!--SEITENLEISTE-->
    <aside class="seitenleiste" aria-label="Navigation">
      <div class="marke">
        <span class="marke-icon">S</span>
        <div><b>Save Your Möbel</b><small>Rechnung-Programm</small></div>
      </div>
      <details class="neu-menu nur-chef">
        <summary class="btn btn-primaer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>Neu erstellen
        </summary>
        <div>
          <a href="#/neu/angebot">Kostenvoranschlag</a>
          <a href="#/neu/rechnung">Rechnung</a>
          <button type="button" data-schnell="auftrag">Anfrage / Auftrag</button>
          <button type="button" data-schnell="termin">Termin</button>
          <button type="button" data-schnell="einnahme">Einnahme (ohne Rechnung)</button>
          <button type="button" data-schnell="ausgabe">Ausgabe</button>
          <button type="button" data-schnell="kunde">Kunde</button>
        </div>
      </details>
      <button type="button" class="suche-knopf" data-suche>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <path d="M20 20l-3.5-3.5" /></svg
        ><span>Suchen</span><kbd>Strg K</kbd>
      </button>
      <nav class="nav">
        <a href="#/dashboard" data-nav="dashboard" class="nur-chef"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7" rx="1.5" />
            <rect x="14" y="3" width="7" height="7" rx="1.5" />
            <rect x="3" y="14" width="7" height="7" rx="1.5" />
            <rect x="14" y="14" width="7" height="7" rx="1.5" /></svg
          ><span>Übersicht</span></a
        >
        <a href="#/auftraege" data-nav="auftraege" class="nur-chef"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="5" height="16" rx="1.5" />
            <rect x="10" y="4" width="5" height="10" rx="1.5" />
            <rect x="17" y="4" width="4" height="13" rx="1.5" /></svg
          ><span>Aufträge</span></a
        >
        <a href="#/angebote" data-nav="angebote" class="nur-chef"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" />
            <path d="M14 3v5h5M9 13h6M9 17h4" /></svg
          ><span>Kostenvoranschläge</span></a
        >
        <a href="#/rechnungen" data-nav="rechnungen" class="nur-chef"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 3h12v18l-3-2-3 2-3-2-3 2z" />
            <path d="M9 8h6M9 12h6M9 16h3" /></svg
          ><span>Rechnungen</span></a
        >
        <a href="#/kalender" data-nav="kalender"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="5" width="18" height="16" rx="2.5" />
            <path d="M3 10h18M8 3v4M16 3v4" /></svg
          ><span>Kalender</span></a
        >
        <a href="#/aufgaben" data-nav="aufgaben" class="nur-chef"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 6h11M9 12h11M9 18h11" />
            <path d="M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5M3.5 18l1.5 1.5 2.5-2.5" /></svg
          ><span>Aufgaben</span></a
        >
        <a href="#/kunden" data-nav="kunden" class="nur-chef"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="9" cy="8" r="3.5" />
            <path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6.5 6.5 0 0 1 3.5 6" /></svg
          ><span>Kunden</span></a
        >
        <a href="#/buchhaltung" data-nav="buchhaltung" class="nur-chef"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="6" width="18" height="14" rx="2.5" />
            <path d="M3 10.5h18M16 15h2M7 6V4.5h10V6" /></svg
          ><span>Buchhaltung</span></a
        >
        <a href="#/mitarbeiter" data-nav="mitarbeiter" class="nur-chef"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 6h11v10H3zM14 9h4l3 3v4h-7" />
            <circle cx="7" cy="17.5" r="2" />
            <circle cx="17" cy="17.5" r="2" /></svg
          ><span>Mitarbeiter</span></a
        >
        <a href="#/einstellungen" data-nav="einstellungen"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12" />
            <circle cx="16" cy="6" r="2" />
            <circle cx="10" cy="12" r="2" />
            <circle cx="18" cy="18" r="2" /></svg
          ><span>Einstellungen</span></a
        >
      </nav>
      <div class="seitenleiste-fuss">
        <button type="button" class="thema-knopf" id="thema-knopf">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg
          ><span>Automatisch</span>
        </button>
        <div class="benutzer-zeile">
          <span id="benutzer-name"></span
          ><button type="button" class="btn-icon" id="abmelden" hidden aria-label="Abmelden" title="Abmelden">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4" /></svg>
          </button>
        </div>
      </div>
    </aside>
    <!--/SEITENLEISTE-->
    <header class="mobil-kopf">
      <button id="menu-btn" class="btn-icon" type="button" aria-label="Menü">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg></button
      ><b>Save Your Möbel</b
      ><button class="btn-icon" type="button" data-suche aria-label="Suchen">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <path d="M20 20l-3.5-3.5" />
        </svg>
      </button>
    </header>
    <main id="main" tabindex="-1"><p class="leer">Lädt…</p></main>
    <nav class="mobil-leiste" aria-label="Schnellzugriff">
      <a href="#/dashboard" data-nav="dashboard" class="nur-chef"
        ><svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1.5" />
          <rect x="14" y="3" width="7" height="7" rx="1.5" />
          <rect x="3" y="14" width="7" height="7" rx="1.5" />
          <rect x="14" y="14" width="7" height="7" rx="1.5" /></svg
        ><span>Übersicht</span></a
      >
      <a href="#/auftraege" data-nav="auftraege" class="nur-chef"
        ><svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="4" width="5" height="16" rx="1.5" />
          <rect x="10" y="4" width="5" height="10" rx="1.5" />
          <rect x="17" y="4" width="4" height="13" rx="1.5" /></svg
        ><span>Aufträge</span></a
      >
      <a href="#/neu/angebot" class="mobil-neu nur-chef" aria-label="Neuer Kostenvoranschlag"
        ><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg
      ></a>
      <a href="#/kalender" data-nav="kalender"
        ><svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="5" width="18" height="16" rx="2.5" />
          <path d="M3 10h18M8 3v4M16 3v4" /></svg
        ><span>Kalender</span></a
      >
      <button type="button" data-suche>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <path d="M20 20l-3.5-3.5" /></svg
        ><span>Suche</span>
      </button>
    </nav>
    <div id="toasts" aria-live="polite"></div>
    <div id="druckbereich"></div>

    <!--SKRIPTE-->
    <script src="lib/chart.js"></script>
    <script src="lib/html2pdf.js" defer></script>
    <script src="build/app.js" type="module"></script>
    <!--/SKRIPTE-->
  </body>
</html>
