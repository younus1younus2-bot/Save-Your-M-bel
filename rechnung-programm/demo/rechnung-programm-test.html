<title>Rechnung-Programm</title>
<meta name="description" content="Test-Version des Rechnung-Programms">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@400;600;700&family=Lato:wght@400;700&family=Poppins:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --rot: #E53935;
  --rot-dunkel: #C62828;
  --gruen: #2E7D32;
  --orange: #EF6C00;
  --text: #1F2328;
  --text-2: #5F6670;
  --rand: #E3E6EA;
  --flaeche: #FFFFFF;
  --hg: #F5F6F8;
  --seite: #1C1F24;
  --radius: 10px;
  --schatten: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: Montserrat, system-ui, sans-serif; font-size: 14px; color: var(--text); background: var(--hg); display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
a { color: var(--rot); }
h1 { font-size: 24px; margin: 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
h2 { font-size: 18px; margin: 0; }
h3 { font-size: 15px; margin: 0 0 14px; }
h4 { font-size: 13px; margin: 18px 0 8px; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; }
code { background: #EEF0F3; padding: 1px 5px; border-radius: 4px; font-size: 12px; }

/* Seitenleiste */
.seitenleiste { background: var(--seite); color: #fff; padding: 20px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.marke { display: flex; gap: 10px; align-items: center; padding: 0 8px 22px; }
.marke small { display: block; color: #9AA1AB; font-size: 11px; }
.marke-icon { width: 36px; height: 36px; border-radius: 8px; background: var(--rot); display: grid; place-items: center; font-weight: 800; font-size: 18px; }
.nav a { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 8px; color: #D3D7DD; text-decoration: none; font-weight: 500; margin-bottom: 2px; }
.nav a:hover { background: rgba(255, 255, 255, .06); color: #fff; }
.nav a.aktiv { background: var(--rot); color: #fff; }
.nav span { width: 20px; text-align: center; }
.mobil-kopf { display: none; }
main { padding: 28px 32px 60px; min-width: 0; }

/* Bausteine */
.seiten-kopf { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.zurueck { font-size: 13px; text-decoration: none; color: var(--text-2); display: inline-block; margin-bottom: 4px; }
.karte { background: var(--flaeche); border: 1px solid var(--rand); border-radius: var(--radius); padding: 20px; box-shadow: var(--schatten); margin-bottom: 16px; min-width: 0; }
.karte-kopf { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.karte-kopf h3 { margin: 0; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--rand); background: #fff; color: var(--text); font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { background: #F0F2F4; }
.btn:disabled { opacity: .5; cursor: default; }
.btn-primaer { background: var(--rot); border-color: var(--rot); color: #fff; }
.btn-primaer:hover { background: var(--rot-dunkel); }
.btn-gruen { background: var(--gruen); border-color: var(--gruen); color: #fff; }
.btn-gruen:hover { background: #1B5E20; }
.btn.rot, button.rot { color: var(--rot); }
.btn-klein { padding: 6px 10px; font-size: 13px; }
.btn-icon { border: 0; background: none; cursor: pointer; font-size: 14px; color: var(--text-2); padding: 4px 6px; border-radius: 6px; }
.btn-icon:hover { background: #EEF0F3; color: var(--text); }
.btn-gruppe { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn-gruppe.rechts { justify-content: flex-end; margin-top: 16px; }
.mehr { position: relative; }
.mehr summary { list-style: none; }
.mehr summary::-webkit-details-marker { display: none; }
.mehr > div { position: absolute; right: 0; top: 110%; background: #fff; border: 1px solid var(--rand); border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, .12); z-index: 20; min-width: 220px; padding: 6px; }
.mehr > div button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 9px 10px; font: inherit; cursor: pointer; border-radius: 6px; }
.mehr > div button:hover { background: #F0F2F4; }

label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 12px; }
.label { font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }
input, select, textarea { font: inherit; font-size: 14px; color: var(--text); padding: 9px 11px; border: 1px solid #CDD2D8; border-radius: 8px; background: #fff; width: 100%; font-weight: 400; }
input:focus, select:focus, textarea:focus { outline: 2px solid rgba(229, 57, 53, .25); border-color: var(--rot); }
input[type="color"] { padding: 2px; height: 40px; }
textarea { resize: vertical; }
label.checkbox { flex-direction: row; align-items: center; gap: 8px; font-weight: 500; color: var(--text); }
label.checkbox input { width: auto; }
.hilfe { font-size: 12px; color: var(--text-2); font-weight: 400; }
.hinweis-box { background: #FFF8E1; border: 1px solid #FFE082; padding: 10px 12px; border-radius: 8px; font-size: 13px; }
.raster-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.raster-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 14px; }
.raster-2.innen { gap: 0 10px; }
.span-2 { grid-column: span 2; }
.leer { color: var(--text-2); padding: 20px; text-align: center; }
.rot { color: var(--rot); }
.gruen { color: var(--gruen); }
.filter-leiste { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
.filter-leiste input, .filter-leiste select { width: auto; min-width: 160px; }
.filter-leiste input[type="search"] { flex: 1; min-width: 200px; }

/* Tabellen */
.tabelle { width: 100%; border-collapse: collapse; }
.tabelle th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--text-2); padding: 8px 10px; border-bottom: 1px solid var(--rand); }
.tabelle td { padding: 11px 10px; border-bottom: 1px solid #F0F2F4; vertical-align: top; }
.tabelle tfoot td { border-bottom: 0; color: var(--text-2); }
.tabelle tr.klickbar { cursor: pointer; }
.tabelle tr.klickbar:hover td { background: #FAFBFC; }
.c-num { text-align: right !important; white-space: nowrap; }
.karte > .tabelle { margin: -8px 0; }
.badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 20px; background: #EEF0F3; color: var(--text-2); vertical-align: middle; }
.badge-offen { background: #E3F2FD; color: #1565C0; }
.badge-bezahlt, .badge-angenommen { background: #E8F5E9; color: var(--gruen); }
.badge-storniert, .badge-abgelehnt { background: #ECEFF1; color: #607D8B; text-decoration: line-through; }
.badge-rot { background: #FFEBEE; color: var(--rot); }
.punkt { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: middle; }

/* KPIs & Dashboard */
.kpi-reihe { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 16px; }
.kpi { background: #fff; border: 1px solid var(--rand); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--schatten); }
.kpi span { font-size: 12px; color: var(--text-2); font-weight: 600; }
.kpi b { display: block; font-size: 24px; margin: 6px 0 4px; }
.kpi small { font-size: 12px; color: var(--text-2); }
.kpi-hervor { background: var(--rot); border-color: var(--rot); color: #fff; }
.kpi-hervor span, .kpi-hervor small { color: rgba(255, 255, 255, .85); }
.raster-dash { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; }
.chart-box { position: relative; height: 300px; }
.chart-box.klein { height: 200px; }
.anteile { margin-top: 12px; }
.anteile > div { display: grid; grid-template-columns: 14px 1fr auto auto; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid #F3F4F6; font-size: 13px; }
.anteile > div:not(:has(i)) { grid-template-columns: 1fr auto auto; }
.anteile i { width: 12px; height: 12px; border-radius: 3px; }
.anteile small { color: var(--text-2); min-width: 90px; text-align: right; }
.termin-liste { list-style: none; padding: 0; margin: 0 0 12px; }
.termin-liste li { padding: 8px 0; border-bottom: 1px solid #F0F2F4; }
.termin-liste small { color: var(--text-2); }
.grenze { margin-bottom: 14px; }
.grenze-kopf { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
.grenze small { color: var(--text-2); font-size: 12px; }
.balken { height: 10px; background: #EEF0F3; border-radius: 10px; overflow: hidden; }
.balken > div { height: 100%; border-radius: 10px; }
.balken-gruen { background: #43A047; }
.balken-orange { background: #FB8C00; }
.balken-rot { background: var(--rot); }
.summen-box > div { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid #F0F2F4; }
.summen-box > div:last-child { border-bottom: 0; }
.summen-box .summe { border-top: 2px solid var(--text); font-size: 15px; }
.raster-buch { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }

/* Editor */
.editor-layout { display: grid; grid-template-columns: minmax(420px, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.editor-vorschau { position: sticky; top: 16px; }
.vorschau-rahmen { background: #D9DCE0; border-radius: var(--radius); padding: 16px; overflow: hidden; }
.vorschau-rahmen.klein { max-width: 560px; margin-top: 10px; }
.vorschau-skaliert { width: 210mm; transform-origin: top left; }
.pos-tabelle { width: 100%; border-collapse: collapse; }
.pos-tabelle th { font-size: 11px; text-transform: uppercase; color: var(--text-2); text-align: left; padding: 4px; }
.pos-tabelle td { padding: 4px; vertical-align: top; }
.pos-tabelle textarea { min-height: 38px; overflow: hidden; }
.pos-tabelle .schmal { min-width: 64px; }
.pos-tabelle .pos-summe { padding-top: 13px; font-weight: 600; }
.pos-griff { display: flex; flex-direction: column; }
.pos-griff .btn-icon { font-size: 9px; padding: 2px 4px; }
.extra-feld { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; margin-bottom: 8px; align-items: center; }
.extra-feld.artikel { grid-template-columns: 2fr 1fr 1fr auto; }
.verlauf { padding-left: 18px; margin: 0; font-size: 13px; }
.verlauf span { color: var(--text-2); }
.summen-box { margin-top: 10px; }

/* Einstellungen */
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px; border-bottom: 1px solid var(--rand); }
.tabs a { padding: 10px 14px; text-decoration: none; color: var(--text-2); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs a.aktiv { color: var(--rot); border-color: var(--rot); }
.radio-karte { flex-direction: row; gap: 12px; align-items: flex-start; border: 1px solid var(--rand); border-radius: 8px; padding: 14px; font-weight: 400; color: var(--text); cursor: pointer; }
.radio-karte input { width: auto; margin-top: 3px; }
.radio-karte:has(input:checked) { border-color: var(--rot); background: #FFF5F5; }
.logo-feld { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.logo-feld img { max-height: 70px; max-width: 220px; border: 1px solid var(--rand); border-radius: 6px; padding: 4px; }
.logo-feld input { width: auto; }

/* Kalender */
.kal-titel { min-width: 180px; }
.kal-raster { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--rand); border-left: 1px solid var(--rand); }
.kal-wt { padding: 8px; font-size: 12px; font-weight: 700; color: var(--text-2); text-align: center; border-right: 1px solid var(--rand); border-bottom: 1px solid var(--rand); background: #FAFBFC; }
.kal-tag { min-height: 110px; padding: 6px; border-right: 1px solid var(--rand); border-bottom: 1px solid var(--rand); cursor: pointer; overflow: hidden; }
.kal-tag:hover { background: #FAFBFC; }
.kal-tag.fremd { background: #FAFAFA; color: #A0A6AE; }
.kal-tag.heute .kal-nr { background: var(--rot); color: #fff; }
.kal-nr { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; font-size: 12px; font-weight: 700; margin-bottom: 4px; }
.kal-termin { font-size: 12px; padding: 3px 6px; border-radius: 5px; margin-bottom: 3px; background: color-mix(in srgb, var(--f) 15%, white); border-left: 3px solid var(--f); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.mitarbeiter-legende { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; font-size: 13px; }
.mitarbeiter-legende i, .chip i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
.mitarbeiter-wahl { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.chip { flex-direction: row; align-items: center; gap: 4px; border: 1px solid var(--rand); border-radius: 20px; padding: 6px 12px; margin: 0; cursor: pointer; color: var(--text); font-weight: 500; }
.chip input { width: auto; margin: 0 4px 0 0; }
.chip:has(input:checked) { border-color: var(--rot); background: #FFF5F5; }

/* Dialoge & Meldungen */
.modal-bg { position: fixed; inset: 0; background: rgba(16, 24, 40, .45); display: grid; place-items: center; z-index: 100; padding: 16px; }
.modal { background: #fff; border-radius: 12px; width: min(620px, 100%); max-height: calc(100vh - 32px); overflow: auto; box-shadow: 0 20px 50px rgba(0, 0, 0, .25); }
.modal-breit { width: min(900px, 100%); }
.modal-kopf { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--rand); position: sticky; top: 0; background: #fff; z-index: 1; }
.modal-kopf h3 { margin: 0; }
.modal-inhalt { padding: 20px; }
#toasts { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 200; }
.toast { background: #1F2328; color: #fff; padding: 12px 16px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, .2); max-width: 380px; }
.toast-fehler { background: var(--rot); }

/* Druck / PDF */
#druckbereich, .pdf-holder { position: fixed; left: -10000px; top: 0; }
@media print {
  @page { size: A4; margin: 0; }
  body.druckt { display: block; background: #fff; }
  body.druckt > *:not(#druckbereich) { display: none !important; }
  body.druckt #druckbereich { position: static; }
}

/* Mobil */
@media (max-width: 1200px) {
  .editor-layout { grid-template-columns: 1fr; }
  .editor-vorschau { position: static; }
  .raster-buch { grid-template-columns: 1fr; }
}
@media (max-width: 860px) {
  body { grid-template-columns: 1fr; }
  .seitenleiste { position: fixed; left: 0; top: 0; z-index: 50; width: 250px; transform: translateX(-100%); transition: transform .2s; }
  body.menu-offen .seitenleiste { transform: none; box-shadow: 0 0 40px rgba(0, 0, 0, .4); }
  .mobil-kopf { display: flex; gap: 10px; align-items: center; padding: 12px 16px; background: var(--seite); color: #fff; position: sticky; top: 0; z-index: 40; }
  .mobil-kopf .btn-icon { color: #fff; font-size: 20px; }
  main { padding: 16px 16px 60px; }
  .raster-dash, .raster-2, .raster-3 { grid-template-columns: 1fr; }
  .span-2 { grid-column: auto; }
  .editor-layout { grid-template-columns: 1fr; }
  .pos-tabelle thead { display: none; }
  .pos-tabelle tr { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; border-bottom: 1px solid var(--rand); padding: 8px 0; }
  .pos-tabelle td:nth-child(2) { grid-column: 1 / -1; order: -1; }
  .pos-griff { flex-direction: row; }
  .kal-tag { min-height: 70px; padding: 3px; }
  .kal-termin { font-size: 10px; padding: 2px 3px; }
  .tabelle { font-size: 13px; }
  .karte { padding: 14px; overflow-x: auto; }
}

/* Feinschliff */
.seiten-kopf > select { width: auto; min-width: 120px; }
.pos-tabelle td:nth-child(2) { width: 100%; }
.pos-tabelle textarea { min-width: 200px; }
.pos-tabelle input.schmal { width: 80px; }
.pos-tabelle select { width: 76px; padding-left: 6px; padding-right: 2px; }
.frage { font-size: 15px; margin: 0; }

/* Rechnungs-/Angebotsvorlage – A4 (210 × 297 mm). Farben kommen aus den Einstellungen. */
.doc-page {
  --d-farbe: #E53935;
  --d-akzent: #1F1F1F;
  width: 210mm;
  min-height: 297mm;
  background: #fff;
  color: #2B2B2B;
  font-family: var(--d-schrift), Montserrat, Arial, sans-serif;
  font-size: 9.5pt;
  line-height: 1.45;
  padding: 0 18mm 34mm;
  position: relative;
  box-sizing: border-box;
}
.doc-page * { box-sizing: border-box; }
.d-band { height: 7mm; background: var(--d-farbe); margin: 0 -18mm; }
.d-kopf { display: flex; justify-content: space-between; align-items: center; padding: 10mm 0 8mm; border-bottom: 1px solid #E6E6E6; }
.d-logo img { max-height: 22mm; max-width: 75mm; object-fit: contain; }
.d-firmenname { font-size: 20pt; font-weight: 800; color: var(--d-farbe); letter-spacing: -.01em; }
.d-titel-box { text-align: right; }
.d-titel { font-size: 22pt; font-weight: 800; color: var(--d-akzent); letter-spacing: .06em; line-height: 1.1; }
.d-nummer { font-size: 10pt; color: var(--d-farbe); font-weight: 700; margin-top: 2mm; }
.d-adressen { display: flex; justify-content: space-between; gap: 10mm; margin-top: 9mm; }
.d-absender { font-size: 7pt; color: #888; text-decoration: underline; margin-bottom: 3mm; }
.d-label { font-size: 7.5pt; text-transform: uppercase; letter-spacing: .08em; color: var(--d-farbe); font-weight: 700; margin-bottom: 1.5mm; }
.d-kunde { font-size: 10.5pt; line-height: 1.5; }
.d-infos { border-collapse: collapse; font-size: 9pt; align-self: flex-start; min-width: 62mm; }
.d-infos td { padding: 1.4mm 0; border-bottom: 1px solid #EFEFEF; }
.d-infos td:first-child { color: #777; padding-right: 8mm; }
.d-infos td:last-child { text-align: right; font-weight: 700; }
.d-felder { display: grid; grid-template-columns: 1fr 1fr; gap: 3mm 8mm; margin-top: 7mm; background: #F7F7F7; border-left: 3px solid var(--d-farbe); padding: 3.5mm 5mm; }
.d-felder span { display: block; font-size: 7pt; text-transform: uppercase; letter-spacing: .06em; color: #888; font-weight: 700; }
.d-betreff { font-size: 13pt; margin: 9mm 0 2mm; color: var(--d-akzent); font-weight: 700; }
.d-text { margin: 3mm 0; }
.d-positionen { width: 100%; border-collapse: collapse; margin-top: 5mm; }
.d-positionen th { background: var(--d-farbe); color: #fff; font-size: 8pt; text-transform: uppercase; letter-spacing: .05em; padding: 2.6mm 2.5mm; text-align: left; font-weight: 700; }
.d-positionen td { padding: 2.6mm 2.5mm; border-bottom: 1px solid #ECECEC; vertical-align: top; }
.d-positionen tbody tr:nth-child(even) td { background: #FAFAFA; }
.d-positionen .c-nr { width: 11mm; color: #888; }
.d-positionen .c-num { text-align: right; white-space: nowrap; }
.d-positionen .c-summe { font-weight: 700; }
.d-leer { color: #aaa; text-align: center; padding: 6mm !important; }
.d-summen-wrap { display: flex; justify-content: flex-end; margin-top: 3mm; }
.d-summen { border-collapse: collapse; min-width: 85mm; }
.d-summen td { padding: 1.6mm 2.5mm; }
.d-summen td:last-child { text-align: right; white-space: nowrap; }
.d-summen .d-gesamt td { background: var(--d-akzent); color: #fff; font-weight: 800; font-size: 11pt; padding: 3mm 2.5mm; }
.d-summen .d-gesamt td:last-child { color: #fff; }
.d-anzahlung { margin: 3mm 0 0 auto; width: 85mm; border: 1px solid var(--d-farbe); border-radius: 2mm; padding: 2mm 3mm; }
.d-anzahlung > div { display: flex; justify-content: space-between; padding: .8mm 0; }
.d-hinweis { font-size: 8.5pt; color: #555; margin-top: 5mm; font-style: italic; }
.d-bank { margin-top: 4mm; padding: 3mm 4mm; background: #F7F7F7; font-size: 8.5pt; border-radius: 1.5mm; }
.d-fuss { position: absolute; left: 0; right: 0; bottom: 0; padding: 5mm 18mm 7mm; border-top: 3px solid var(--d-farbe); display: flex; justify-content: space-between; gap: 5mm; font-size: 7pt; color: #666; line-height: 1.5; background: #fff; }
/* knapp unter A4-Höhe, damit keine leere Zusatzseite entsteht */
#druckbereich .doc-page { min-height: 294mm; }


.demo-box { margin: 20px 8px 0; padding: 12px; border-radius: 8px; background: rgba(255, 255, 255, .07); font-size: 12px; color: #C9CED6; display: flex; flex-direction: column; gap: 8px; }
.demo-box b { color: #fff; font-size: 13px; }
.demo-box .btn { background: transparent; color: #fff; border-color: rgba(255, 255, 255, .25); justify-content: center; white-space: normal; text-align: center; }

<script>
// Grundfunktionen: API, Zustand, Formatierung, Berechnung, Rechnungsvorlage
const S = {
  settings: null,
  kunden: [],
  dokumente: [],
  buchungen: [],
  mitarbeiter: [],
  termine: []
};

async function api(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Fehler ${res.status}`);
  return data;
}

async function ladeAlles() {
  const [settings, kunden, dokumente, buchungen, mitarbeiter, termine] = await Promise.all([
    api('GET', '/api/settings'),
    api('GET', '/api/kunden'),
    api('GET', '/api/dokumente'),
    api('GET', '/api/buchungen'),
    api('GET', '/api/mitarbeiter'),
    api('GET', '/api/termine')
  ]);
  Object.assign(S, { settings, kunden, dokumente, buchungen, mitarbeiter, termine });
}

// Speichert ein Objekt (neu oder vorhanden) und aktualisiert den lokalen Zustand
async function speichere(col, item) {
  const saved = item.id ? await api('PUT', `/api/${col}/${item.id}`, item) : await api('POST', `/api/${col}`, item);
  const list = S[col];
  const i = list.findIndex((x) => x.id === saved.id);
  if (i >= 0) list[i] = saved;
  else list.push(saved);
  return saved;
}

async function loesche(col, id) {
  await api('DELETE', `/api/${col}/${id}`);
  S[col] = S[col].filter((x) => x.id !== id);
}

async function speichereEinstellungen() {
  S.settings = await api('PUT', '/api/settings', S.settings);
}

// ---------- Helfer ----------
// Kleiner Zwischenspeicher für Ansichts-Einstellungen (funktioniert auch, wenn der Browser Speicher blockiert)
const merker = (() => {
  const mem = {};
  return {
    get(k) { try { return sessionStorage.getItem(k); } catch { return mem[k] ?? null; } },
    set(k, v) { try { sessionStorage.setItem(k, v); } catch { mem[k] = String(v); } },
    del(k) { try { sessionStorage.removeItem(k); } catch { delete mem[k]; } }
  };
})();

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

function esc(v) {
  return String(v ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
const nl2br = (v) => esc(v).replace(/\n/g, '<br>');

const euroFmt = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' });
const euro = (n) => euroFmt.format(Number(n) || 0);
const zahl = (n, d = 2) => (Number(n) || 0).toLocaleString('de-DE', { minimumFractionDigits: 0, maximumFractionDigits: d });
const prozent = (n) => `${(Number(n) || 0).toLocaleString('de-DE', { maximumFractionDigits: 1 })} %`;
const r2 = (n) => Math.round((Number(n) + Number.EPSILON) * 100) / 100;

// Eingaben mit Komma erlauben: "1.234,50" -> 1234.5
function parseZahl(v) {
  if (typeof v === 'number') return v;
  let s = String(v || '').trim().replace(/\s|€|%/g, '');
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = parseFloat(s);
  return Number.isFinite(n) ? n : 0;
}

const heute = () => isoDatum(new Date());
function isoDatum(d) {
  const x = new Date(d);
  return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
}
function plusTage(iso, tage) {
  const d = new Date(`${iso}T12:00:00`);
  d.setDate(d.getDate() + Number(tage || 0));
  return isoDatum(d);
}
function datum(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.slice(0, 10).split('-');
  return `${d}.${m}.${y}`;
}
const MONATE = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
const MONATE_KURZ = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];

function toast(msg, typ = 'ok') {
  const el = document.createElement('div');
  el.className = `toast toast-${typ}`;
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), typ === 'fehler' ? 7000 : 3500);
}

// Einfaches Dialogfenster
function modal(titel, inhaltHtml, { breit = false, beimSchliessen } = {}) {
  const wrap = document.createElement('div');
  wrap.className = 'modal-bg';
  wrap.innerHTML = `<div class="modal ${breit ? 'modal-breit' : ''}">
    <div class="modal-kopf"><h3>${esc(titel)}</h3><button class="btn-icon" data-close title="Schließen">✕</button></div>
    <div class="modal-inhalt">${inhaltHtml}</div></div>`;
  const close = () => {
    if (!wrap.isConnected) return;
    wrap.remove();
    if (beimSchliessen) beimSchliessen();
  };
  wrap.addEventListener('mousedown', (e) => { if (e.target === wrap) close(); });
  $('[data-close]', wrap).onclick = close;
  document.body.appendChild(wrap);
  return { el: $('.modal', wrap), close };
}

// Rückfrage als eigener Dialog (Browser-Popups sind nicht überall erlaubt)
function bestaetigen(text, { ok = 'Ja, weiter', abbrechen = 'Abbrechen' } = {}) {
  return new Promise((resolve) => {
    let antwort = false;
    const { el, close } = modal('Bitte bestätigen', `<p class="frage">${esc(text)}</p>
      <div class="btn-gruppe rechts"><button class="btn" data-nein>${esc(abbrechen)}</button><button class="btn btn-primaer" data-ja>${esc(ok)}</button></div>`,
      { beimSchliessen: () => resolve(antwort) });
    $('[data-nein]', el).onclick = close;
    $('[data-ja]', el).onclick = () => { antwort = true; close(); };
    $('[data-ja]', el).focus();
  });
}

// ---------- Berechnung ----------
// Kleinunternehmer: Preise sind Endpreise, keine USt.
// Regelbesteuerung: Preise sind Netto, USt je Position.
function berechne(doc) {
  const klein = doc.steuerModus === 'klein';
  const rabatt = parseZahl(doc.rabattProzent);
  const faktor = 1 - rabatt / 100;
  let summePos = 0;
  const proSatz = {};
  const positionen = (doc.positionen || []).map((p) => {
    const betrag = r2(parseZahl(p.menge) * parseZahl(p.preis));
    summePos += betrag;
    const satz = klein ? 0 : parseZahl(p.ustSatz ?? 19);
    proSatz[satz] = (proSatz[satz] || 0) + betrag;
    return { ...p, betrag };
  });
  summePos = r2(summePos);
  positionen.forEach((p) => { p.anteil = summePos ? (p.betrag / summePos) * 100 : 0; });
  const rabattBetrag = r2(summePos - summePos * faktor);
  const netto = r2(summePos - rabattBetrag);
  const steuern = klein
    ? []
    : Object.keys(proSatz)
        .map(Number)
        .filter((s) => s > 0)
        .sort((a, b) => b - a)
        .map((satz) => {
          const basis = r2(proSatz[satz] * faktor);
          return { satz, basis, betrag: r2((basis * satz) / 100) };
        });
  const ust = r2(steuern.reduce((a, s) => a + s.betrag, 0));
  const brutto = r2(netto + ust);
  const anzahlungProzent = parseZahl(doc.anzahlungProzent);
  const anzahlung = r2((brutto * anzahlungProzent) / 100);
  return { positionen, summePos, rabatt, rabattBetrag, netto, steuern, ust, brutto, anzahlungProzent, anzahlung, rest: r2(brutto - anzahlung), klein };
}

// Platzhalter in Texten ersetzen
function platzhalter(text, doc) {
  const s = S.settings;
  const c = doc ? berechne(doc) : null;
  const map = {
    FIRMA: s.firma.name,
    KUNDE: doc ? doc.kunde?.name || '' : '',
    NUMMER: doc ? doc.nummer || '' : '',
    BETRAG: c ? euro(c.brutto) : '',
    DATUM: doc ? datum(doc.datum) : '',
    FAELLIG: doc ? datum(doc.faelligAm) : '',
    GUELTIG: doc ? datum(doc.gueltigBis) : '',
    ZIEL: doc && doc.datum && doc.faelligAm ? Math.round((new Date(doc.faelligAm) - new Date(doc.datum)) / 864e5) : s.zahlungszielTage,
    JAHR: new Date().getFullYear()
  };
  return String(text || '').replace(/\{([A-Z]+)\}/g, (m, k) => (k in map ? map[k] : m));
}

// ---------- Rechnungs-/Angebotsvorlage (A4) ----------

  const zeigeAnteil = !!doc.zeigeAnteil;
  const farbe = s.design.farbe || '#E53935';
  const akzent = s.design.akzent || '#1F1F1F';

  const infos = [
    [istRechnung ? 'Rechnungsnr.' : 'Angebotsnr.', doc.nummer],

    ...(doc.extraFelder || []).map((x) => [x.label, x.wert])
  ].filter(([l, v]) => l && v);

  const rows = c.positionen
    .map(
      (p, i) => `<tr>
        <td class="c-nr">${i + 1}</td>
        <td class="c-beschr">${nl2br(p.beschreibung)}</td>
        <td class="c-num">${zahl(p.menge, 3)} ${esc(p.einheit || '')}</td>
        <td class="c-num">${euro(p.preis)}</td>
        ${zeigeUst ? `<td class="c-num">${zahl(p.ustSatz ?? 19)} %</td>` : ''}
        ${zeigeAnteil ? `<td class="c-num">${prozent(p.anteil)}</td>` : ''}
        <td class="c-num c-summe">${euro(p.betrag)}</td>
      </tr>`
    )
    .join('');

  const summen = [];
  if (c.rabatt || zeigeUst) summen.push(['Zwischensumme', euro(c.summePos)]);
  if (c.rabatt) summen.push([`Rabatt (${prozent(c.rabatt)})`, `– ${euro(c.rabattBetrag)}`]);
  if (zeigeUst) {
    if (c.rabatt) summen.push(['Nettobetrag', euro(c.netto)]);
    c.steuern.forEach((st) => summen.push([`zzgl. ${zahl(st.satz)} % USt. auf ${euro(st.basis)}`, euro(st.betrag)]));
  }
  const gesamtLabel = zeigeUst ? 'Gesamtbetrag (brutto)' : 'Gesamtbetrag';

  const anzahlung = c.anzahlungProzent
    ? `<div class="d-anzahlung">
        <div><span>${istRechnung ? 'Anzahlung' : 'Anzahlung bei Auftrag'} (${prozent(c.anzahlungProzent)})</span><b>${euro(c.anzahlung)}</b></div>
        <div><span>${istRechnung ? 'Restbetrag' : 'Restbetrag nach Umzug'}</span><b>${euro(c.rest)}</b></div>
      </div>`
    : '';

  const steuerHinweis = c.klein
    ? 'Gemäß § 19 UStG wird keine Umsatzsteuer berechnet (Kleinunternehmerregelung).'
    : '';

  const fuss = [
    [f.name, f.inhaber ? `Inhaber: ${f.inhaber}` : '', f.strasse, [f.plz, f.ort].filter(Boolean).join(' ')],
    [f.telefon ? `Tel.: ${f.telefon}` : '', f.email, f.web],
    [f.bank, f.iban ? `IBAN: ${f.iban}` : '', f.bic ? `BIC: ${f.bic}` : ''],
    [f.steuernummer ? `Steuernr.: ${f.steuernummer}` : '', f.ustId ? `USt-IdNr.: ${f.ustId}` : '']
  ]
    .map((col) => col.filter(Boolean))
    .filter((col) => col.length)
    .map((col) => `<div>${col.map(esc).join('<br>')}</div>`)
    .join('');

  return `<div class="doc-page" style="--d-farbe:${esc(farbe)};--d-akzent:${esc(akzent)};--d-schrift:'${esc(s.design.schrift || 'Montserrat')}'">
    <div class="d-band"></div>
    <header class="d-kopf">
      <div class="d-logo">${f.logo ? `<img src="${esc(f.logo)}" alt="Logo">` : `<div class="d-firmenname">${esc(f.name)}</div>`}</div>

        <div class="d-titel">${esc(titel.toUpperCase())}</div>
        <div class="d-nummer">${esc(doc.nummer || '')}</div>
      </div>
    </header>
    <section class="d-adressen">
      <div class="d-empfaenger">
        <div class="d-absender">${esc(absenderZeile)}</div>
        <div class="d-label">${istRechnung ? 'Rechnung an' : 'Kostenvoranschlag für'}</div>

    <table class="d-positionen">

    <footer class="d-fuss">${fuss}</footer>
  </div>`;
}

// PDF aus der Vorlage erzeugen (im Browser, mit html2pdf.js)
async function dokumentPdf(doc) {
  const holder = document.createElement('div');
  holder.className = 'pdf-holder';
  holder.innerHTML = renderDokument(doc);
  // knapp unter A4-Höhe, sonst entsteht durch Rundung eine leere Zusatzseite
  holder.firstElementChild.style.minHeight = '294mm';
  document.body.appendChild(holder);
  try {
    const worker = html2pdf()
      .set({
        margin: 0,
        filename: dateiname(doc),
        image: { type: 'jpeg', quality: 0.95 },
        html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak: { mode: ['css', 'legacy'], avoid: ['tr', '.d-summen-wrap', '.d-anzahlung'] }
      })
      .from(holder.firstElementChild);
    return await worker.outputPdf('blob');
  } finally {
    holder.remove();
  }
}

function dateiname(doc) {
  const art = doc.typ === 'rechnung' ? 'Rechnung' : 'Kostenvoranschlag';
  const kunde = (doc.kunde?.name || '').replace(/[^\wäöüÄÖÜß-]+/g, '_');
  return `${art}_${(doc.nummer || 'Entwurf').replace(/[^\w-]+/g, '_')}${kunde ? `_${kunde}` : ''}.pdf`;
}

function blobZuBase64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function drucken(html) {

// A4-Vorschau an die verfügbare Breite anpassen
function skaliereVorschau(el) {
  const rahmen = el.parentElement;
  const passen = () => {
    const breite = rahmen.clientWidth - 32;
    const faktor = Math.min(1, breite / el.offsetWidth);
    el.style.transform = `scale(${faktor})`;
    el.style.height = `${el.scrollHeight}px`;
    rahmen.style.height = `${el.scrollHeight * faktor + 32}px`;
  };
  passen();
  if (!el._beobachter) {
    el._beobachter = new ResizeObserver(passen);
    el._beobachter.observe(rahmen);
  }
}

async function api(method, url, body) {
  if (!demoDb) {
    demoDb = demoLaden() || demoBeispieldaten();
    demoDb.settings = demoMerge(window.DEMO_DEFAULTS, demoDb.settings || {});
    DEMO_COLS.forEach((c) => (demoDb[c] = demoDb[c] || []));
    demoSpeichern();
  }
  const teile = url.split('/').filter(Boolean);
  const antwort = (x) => kopie(x);

  if (url === '/api/settings') {
    if (method === 'PUT') {
      demoDb.settings = demoMerge(window.DEMO_DEFAULTS, body || {});
      demoSpeichern();
    }
    return antwort(demoDb.settings);
  }
  if (teile[0] === 'api' && teile[1] === 'nummer') {
    const cfg = demoDb.settings.nummern[teile[2]];
    const nummer = cfg.prefix.replace('{JAHR}', String(new Date().getFullYear())) + String(cfg.naechste).padStart(cfg.stellen || 1, '0');
    cfg.naechste += 1;
    demoSpeichern();
    return { nummer };
  }
  if (url.startsWith('/api-mail')) {
    throw new Error('In der Test-Version werden keine E-Mails verschickt. Im eigenen Portal mit Server geht die Mail mit PDF direkt an den Kunden.');
  }
  if (url === '/api-restore') {
    demoDb = { settings: demoMerge(window.DEMO_DEFAULTS, body.settings) };
    DEMO_COLS.forEach((c) => (demoDb[c] = Array.isArray(body[c]) ? body[c] : []));
    demoSpeichern();
    return { ok: true };
  }
  if (teile[0] === 'api' && DEMO_COLS.includes(teile[1])) {
    const list = demoDb[teile[1]];
    const id = teile[2];
    if (method === 'GET') return antwort(list);
    if (method === 'POST') {
      const item = { ...body, id: demoId(), erstellt: new Date().toISOString() };
      list.push(item);
      demoSpeichern();
      return antwort(item);
    }
    const i = list.findIndex((x) => x.id === id);
    if (i < 0) throw new Error('Nicht gefunden');
    if (method === 'PUT') {
      list[i] = { ...list[i], ...body, id, geaendert: new Date().toISOString() };
      demoSpeichern();
      return antwort(list[i]);
    }
    if (method === 'DELETE') {
      list.splice(i, 1);
      demoSpeichern();
      return { ok: true };
    }
  }
  throw new Error(`Unbekannte Anfrage: ${method} ${url}`);
}

async function download(blob, name) {
  const dl = await demoDownloads;
  if (!dl) return toast(`„${name}“ wurde erstellt. Herunterladen ist in dieser Ansicht nicht möglich.`);
  try {
    await dl.save({ filename: name, data: blob });
  } catch (e) {
    if (e?.code === 'declined') return;
    if (e?.code === 'rejected_extension') return toast('Dieses Dateiformat kann die Test-Version nicht speichern. Im eigenen Portal geht es.', 'fehler');
    if (e?.code === 'rate_limited') return toast('Bitte kurz warten und noch einmal versuchen.', 'fehler');
    toast('Herunterladen ist in dieser Ansicht nicht möglich.', 'fehler');
  }
}
