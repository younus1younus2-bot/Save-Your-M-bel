<title>Rechnung-Programm</title>
<meta name="description" content="Test-Version des Rechnung-Programms">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@400;600;700&family=Lato:wght@400;700&family=Poppins:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Portal-Design: Schwarz/Rot aus dem Logo, Schrift Aileron, heller und dunkler Modus */
:root {
  --bg: #F3F3F4;
  --flaeche: #FFFFFF;
  --flaeche-2: #F8F8F9;
  --flaeche-hover: #F1F1F3;
  --rand: #E6E6E9;
  --rand-stark: #D2D2D7;
  --text: #16161A;
  --text-2: #62626C;
  --text-3: #9696A0;
  --akzent: #E53935;
  --akzent-hover: #C92C28;
  --akzent-weich: #FDEDEC;
  --akzent-text: #B42622;
  --gruen: #147A3D;
  --gruen-weich: #E6F4EB;
  --orange: #B4530B;
  --orange-weich: #FDF0E3;
  --blau: #1F4FC2;
  --blau-weich: #E9EFFD;
  --grau-weich: #EEEEF1;
  --seite: #101012;
  --seite-2: #1B1B1F;
  --seite-text: #9F9FA8;
  --seite-text-hell: #F4F4F5;
  --hervor: #141416;
  --hervor-text: #FFFFFF;
  --radius: 14px;
  --radius-klein: 10px;
  --schatten: 0 1px 2px rgba(16, 16, 20, .04), 0 6px 20px -8px rgba(16, 16, 20, .08);
  --schatten-hoch: 0 20px 50px -12px rgba(16, 16, 20, .28);
  --fokus: 0 0 0 3px rgba(229, 57, 53, .22);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C0C0E; --flaeche: #151518; --flaeche-2: #1B1B1F; --flaeche-hover: #212126; --rand: #26262C; --rand-stark: #36363E;
    --text: #F2F2F4; --text-2: #A3A3AD; --text-3: #6E6E78;
    --akzent: #F04E4A; --akzent-hover: #FF625E; --akzent-weich: rgba(240, 78, 74, .14); --akzent-text: #FF8481;
    --gruen: #4ADE80; --gruen-weich: rgba(74, 222, 128, .12); --orange: #FDBA74; --orange-weich: rgba(253, 186, 116, .12);
    --blau: #93B4FF; --blau-weich: rgba(147, 180, 255, .12); --grau-weich: #232328;
    --seite: #0A0A0B; --seite-2: #19191D; --hervor: #F2F2F4; --hervor-text: #0C0C0E;
    --schatten: 0 1px 2px rgba(0, 0, 0, .3); --schatten-hoch: 0 20px 50px -12px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C0C0E; --flaeche: #151518; --flaeche-2: #1B1B1F; --flaeche-hover: #212126; --rand: #26262C; --rand-stark: #36363E;
  --text: #F2F2F4; --text-2: #A3A3AD; --text-3: #6E6E78;
  --akzent: #F04E4A; --akzent-hover: #FF625E; --akzent-weich: rgba(240, 78, 74, .14); --akzent-text: #FF8481;
  --gruen: #4ADE80; --gruen-weich: rgba(74, 222, 128, .12); --orange: #FDBA74; --orange-weich: rgba(253, 186, 116, .12);
  --blau: #93B4FF; --blau-weich: rgba(147, 180, 255, .12); --grau-weich: #232328;
  --seite: #0A0A0B; --seite-2: #19191D; --hervor: #F2F2F4; --hervor-text: #0C0C0E;
  --schatten: 0 1px 2px rgba(0, 0, 0, .3); --schatten-hoch: 0 20px 50px -12px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: Aileron, 'Helvetica Neue', Arial, sans-serif; font-size: 14px; line-height: 1.5; color: var(--text); background: var(--bg);
  display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; -webkit-font-smoothing: antialiased;
}
a { color: var(--akzent-text); }
svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
h1 { font-size: 26px; line-height: 1.2; margin: 0; letter-spacing: -.005em; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; text-wrap: balance; }
h2 { font-size: 18px; margin: 0; }
h3 { font-size: 15px; margin: 0 0 16px; letter-spacing: .005em; }
h4 { font-size: 11px; margin: 22px 0 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; }
code { background: var(--grau-weich); padding: 1px 6px; border-radius: 6px; font-size: 12px; }
:focus-visible { outline: none; box-shadow: var(--fokus); }

/* ---------- Seitenleiste ---------- */
.seitenleiste { background: var(--seite); color: var(--seite-text-hell); padding: 22px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
.marke { display: flex; gap: 12px; align-items: center; padding: 0 6px; }
.marke small { display: block; color: var(--seite-text); font-size: 11px; }
.marke-icon { width: 36px; height: 36px; border-radius: 10px; background: #E53935; display: grid; place-items: center; font-weight: 700; }
.marke-logo { width: 100%; max-width: 172px; display: block; margin: 0 auto; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: var(--radius-klein); color: var(--seite-text); text-decoration: none; font-weight: 400; position: relative; transition: background .15s, color .15s; }
.nav a:hover { background: var(--seite-2); color: var(--seite-text-hell); }
.nav a.aktiv { background: var(--seite-2); color: #fff; font-weight: 700; }
.nav a.aktiv::before { content: ''; position: absolute; left: -14px; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: #E53935; }
.nav a.aktiv svg { color: #E53935; }
.neu-menu { position: relative; }
.neu-menu summary { list-style: none; width: 100%; justify-content: center; }
.neu-menu summary::-webkit-details-marker { display: none; }
.neu-menu > div { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--flaeche); border: 1px solid var(--rand); border-radius: var(--radius-klein); box-shadow: var(--schatten-hoch); padding: 6px; z-index: 30; display: flex; flex-direction: column; }
.neu-menu > div a, .neu-menu > div button { display: block; text-align: left; border: 0; background: none; padding: 9px 12px; font: inherit; color: var(--text); text-decoration: none; cursor: pointer; border-radius: 8px; }
.neu-menu > div a:hover, .neu-menu > div button:hover { background: var(--flaeche-hover); }
.demo-box { margin-top: auto; }
.demo-box + .thema-knopf { margin-top: 0; }
.thema-knopf { margin-top: auto; display: flex; gap: 10px; align-items: center; background: none; border: 0; color: var(--seite-text); font: inherit; font-size: 13px; padding: 10px 12px; border-radius: var(--radius-klein); cursor: pointer; text-align: left; }
.thema-knopf:hover { background: var(--seite-2); color: var(--seite-text-hell); }
.mobil-kopf { display: none; }
main { padding: 32px 40px 72px; min-width: 0; max-width: 1560px; width: 100%; }

/* ---------- Bausteine ---------- */
.seiten-kopf { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
.seiten-kopf p { margin: 4px 0 0; color: var(--text-2); }
.zurueck { font-size: 13px; text-decoration: none; color: var(--text-2); display: inline-flex; margin-bottom: 6px; }
.zurueck:hover { color: var(--text); }
.karte { background: var(--flaeche); border: 1px solid var(--rand); border-radius: var(--radius); padding: 22px; box-shadow: var(--schatten); margin-bottom: 18px; min-width: 0; }
.karte-kopf { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.karte-kopf h3 { margin: 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 15px; border-radius: var(--radius-klein); border: 1px solid var(--rand-stark); background: var(--flaeche); color: var(--text); font: inherit; font-weight: 700; font-size: 13.5px; cursor: pointer; text-decoration: none; white-space: nowrap; transition: background .15s, border-color .15s, transform .05s; }
.btn:hover { background: var(--flaeche-hover); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: default; }
.btn svg { width: 16px; height: 16px; }
.btn-primaer { background: var(--akzent); border-color: var(--akzent); color: #fff; }
.btn-primaer:hover { background: var(--akzent-hover); border-color: var(--akzent-hover); }
.btn-gruen { background: var(--gruen-weich); border-color: transparent; color: var(--gruen); }
.btn-gruen:hover { background: var(--gruen-weich); filter: brightness(.96); }
.btn.rot, button.rot { color: var(--akzent-text); }
.btn-klein { padding: 6px 11px; font-size: 12.5px; }
.btn-icon { border: 0; background: none; cursor: pointer; font-size: 14px; color: var(--text-3); padding: 5px 7px; border-radius: 8px; display: inline-grid; place-items: center; }
.btn-icon:hover { background: var(--flaeche-hover); color: var(--text); }
.btn-gruppe { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn-gruppe.rechts { justify-content: flex-end; margin-top: 18px; }
.mehr { position: relative; }
.mehr summary { list-style: none; }
.mehr summary::-webkit-details-marker { display: none; }
.mehr > div { position: absolute; right: 0; top: calc(100% + 6px); background: var(--flaeche); border: 1px solid var(--rand); border-radius: var(--radius-klein); box-shadow: var(--schatten-hoch); z-index: 20; min-width: 230px; padding: 6px; }
.mehr > div button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 9px 12px; font: inherit; color: var(--text); cursor: pointer; border-radius: 8px; }
.mehr > div button:hover { background: var(--flaeche-hover); }

label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700; color: var(--text-2); margin-bottom: 14px; }
.label { font-size: 12px; font-weight: 700; color: var(--text-2); margin-bottom: 8px; }
input, select, textarea { font: inherit; font-size: 14px; color: var(--text); padding: 10px 12px; border: 1px solid var(--rand); border-radius: var(--radius-klein); background: var(--flaeche-2); width: 100%; font-weight: 400; transition: border-color .15s, background .15s, box-shadow .15s; }
input:hover, select:hover, textarea:hover { border-color: var(--rand-stark); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--akzent); background: var(--flaeche); box-shadow: var(--fokus); }
input::placeholder, textarea::placeholder { color: var(--text-3); }
input[type="color"] { padding: 3px; height: 42px; }
textarea { resize: vertical; }
label.checkbox { flex-direction: row; align-items: center; gap: 10px; font-weight: 400; color: var(--text); font-size: 13.5px; }
label.checkbox input { width: 18px; height: 18px; accent-color: var(--akzent); }
.hilfe { font-size: 12px; color: var(--text-3); font-weight: 400; }
.hinweis-box { background: var(--orange-weich); color: var(--text); border-radius: var(--radius-klein); padding: 12px 14px; font-size: 13px; }
.raster-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
.raster-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 16px; }
.raster-2.innen { gap: 0 12px; }
.span-2 { grid-column: span 2; }
.leer { color: var(--text-3); padding: 28px; text-align: center; }
.rot { color: var(--akzent-text); }
.gruen { color: var(--gruen); }
.filter-leiste { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.filter-leiste input, .filter-leiste select { width: auto; min-width: 160px; background: var(--flaeche); }
.filter-leiste input[type="search"] { flex: 1; min-width: 220px; }
.seiten-kopf > select { width: auto; min-width: 120px; background: var(--flaeche); }

/* ---------- Tabellen ---------- */
.tabelle { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.tabelle th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-3); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--rand); }
.tabelle td { padding: 13px 12px; border-bottom: 1px solid var(--rand); vertical-align: middle; }
.tabelle tbody tr:last-child td { border-bottom: 0; }
.tabelle tfoot td { border-top: 1px solid var(--rand); border-bottom: 0; color: var(--text-2); }
.tabelle tr.klickbar { cursor: pointer; transition: background .12s; }
.tabelle tr.klickbar:hover td { background: var(--flaeche-hover); }
.tabelle small { color: var(--text-3); }
.c-num { text-align: right !important; white-space: nowrap; font-variant-numeric: tabular-nums; }
.karte > .tabelle { margin: -10px 0; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; padding: 3px 10px 3px 8px; border-radius: 20px; background: var(--grau-weich); color: var(--text-2); vertical-align: middle; white-space: nowrap; }
.badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge-offen { background: var(--blau-weich); color: var(--blau); }
.badge-bezahlt, .badge-angenommen { background: var(--gruen-weich); color: var(--gruen); }
.badge-storniert, .badge-abgelehnt { background: var(--grau-weich); color: var(--text-3); }
.badge-rot { background: var(--akzent-weich); color: var(--akzent-text); }
.punkt { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: middle; }

/* ---------- Übersicht ---------- */
.begruessung { margin-bottom: 26px; }
.begruessung p { margin: 6px 0 0; color: var(--text-2); }
.kpi-reihe { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 18px; }
.kpi { background: var(--flaeche); border: 1px solid var(--rand); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--schatten); display: flex; flex-direction: column; gap: 6px; }
.kpi span { font-size: 12.5px; color: var(--text-2); font-weight: 700; }
.kpi b { display: block; font-size: 27px; letter-spacing: -.01em; line-height: 1.15; font-variant-numeric: tabular-nums; }
.kpi small { font-size: 12px; color: var(--text-3); }
.kpi-hervor { background: var(--hervor); border-color: var(--hervor); color: var(--hervor-text); }
.kpi-hervor span, .kpi-hervor small { color: var(--hervor-text); opacity: .7; }
.trend { display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 20px; width: fit-content; }
.trend-gut { background: var(--gruen-weich); color: var(--gruen); }
.trend-schlecht { background: var(--akzent-weich); color: var(--akzent-text); }
.raster-dash { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 18px; }
.chart-box { position: relative; height: 300px; }
.chart-box.klein { height: 190px; }
.anteile { margin-top: 14px; font-variant-numeric: tabular-nums; }
.anteile > div { display: grid; grid-template-columns: 12px 1fr auto auto; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--rand); font-size: 13px; }
.anteile > div:last-child { border-bottom: 0; }
.anteile > div:not(:has(i)) { grid-template-columns: 1fr auto auto; }
.anteile i { width: 10px; height: 10px; border-radius: 3px; }
.anteile small { color: var(--text-3); min-width: 90px; text-align: right; }
.termin-liste { list-style: none; padding: 0; margin: 0 0 14px; }
.termin-liste li { padding: 10px 0; border-bottom: 1px solid var(--rand); }
.termin-liste small { color: var(--text-3); }
.grenze { margin-bottom: 16px; }
.grenze-kopf { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; font-variant-numeric: tabular-nums; }
.grenze small { color: var(--text-3); font-size: 12px; }
.balken { height: 8px; background: var(--grau-weich); border-radius: 10px; overflow: hidden; margin-bottom: 4px; }
.balken > div { height: 100%; border-radius: 10px; }
.balken-gruen { background: var(--gruen); }
.balken-orange { background: var(--orange); }
.balken-rot { background: var(--akzent); }
.summen-box { font-variant-numeric: tabular-nums; }
.summen-box > div { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--rand); }
.summen-box > div:last-child { border-bottom: 0; }
.summen-box .summe { border-top: 2px solid var(--text); font-size: 15px; }
.raster-buch { display: grid; grid-template-columns: minmax(0, 1fr) 350px; gap: 18px; align-items: start; }
.schnellstart { background: linear-gradient(135deg, var(--akzent-weich), var(--flaeche) 70%); }
.schnellstart ol { margin: 0; padding-left: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 8px 28px; }
.schnellstart li a { color: var(--text); text-decoration: none; font-weight: 700; }
.schnellstart li a:hover { color: var(--akzent-text); }
.schnellstart li.erledigt a { color: var(--text-3); font-weight: 400; }
.schnellstart li.erledigt::marker { color: var(--gruen); }

/* ---------- Editor ---------- */
.editor-layout { display: grid; grid-template-columns: minmax(440px, 1fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.editor-vorschau { position: sticky; top: 20px; }
.vorschau-rahmen { background: var(--grau-weich); border-radius: var(--radius); padding: 16px; overflow: hidden; }
.vorschau-rahmen .doc-page { box-shadow: 0 10px 40px -10px rgba(0, 0, 0, .25); }
.vorschau-rahmen.klein { max-width: 560px; margin-top: 12px; }
.vorschau-skaliert { width: 210mm; transform-origin: top left; }
.summen-box { margin-top: 12px; }
.pos-tabelle { width: 100%; border-collapse: collapse; }
.pos-tabelle th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); text-align: left; padding: 4px; }
.pos-tabelle td { padding: 4px; vertical-align: top; }
.pos-tabelle td:nth-child(2) { width: 100%; }
.pos-tabelle textarea { min-height: 42px; overflow: hidden; min-width: 200px; }
.pos-tabelle input.schmal { width: 84px; }
.pos-tabelle select { width: 78px; padding-left: 8px; padding-right: 2px; }
.pos-tabelle .pos-summe { padding-top: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pos-griff { display: flex; flex-direction: column; }
.pos-griff .btn-icon { font-size: 9px; padding: 2px 5px; }
.extra-feld { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; margin-bottom: 8px; align-items: center; }
.extra-feld.artikel { grid-template-columns: 2fr 1fr 1fr auto; }
.verlauf { padding-left: 18px; margin: 0; font-size: 13px; }
.verlauf li { padding: 3px 0; }
.verlauf span { color: var(--text-3); }

/* ---------- Einstellungen ---------- */
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 18px; background: var(--grau-weich); padding: 4px; border-radius: 12px; width: fit-content; max-width: 100%; }
.tabs a { padding: 8px 14px; text-decoration: none; color: var(--text-2); font-weight: 700; font-size: 13px; border-radius: 9px; }
.tabs a:hover { color: var(--text); }
.tabs a.aktiv { color: var(--text); background: var(--flaeche); box-shadow: var(--schatten); }
.radio-karte { flex-direction: row; gap: 12px; align-items: flex-start; border: 1px solid var(--rand); border-radius: var(--radius-klein); padding: 16px; font-weight: 400; color: var(--text); cursor: pointer; font-size: 13.5px; }
.radio-karte input { width: auto; margin-top: 3px; accent-color: var(--akzent); }
.radio-karte:has(input:checked) { border-color: var(--akzent); background: var(--akzent-weich); }
.logo-feld { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.logo-feld img { max-height: 76px; max-width: 220px; border: 1px solid var(--rand); border-radius: 10px; padding: 6px; background: #fff; }
.logo-feld img.logo-dunkel { background: #2B2B2B; }
.logo-feld input { width: auto; }

/* ---------- Kalender ---------- */
.kal-titel { min-width: 190px; }
.kal-raster { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; background: var(--rand); border: 1px solid var(--rand); border-radius: var(--radius-klein); overflow: hidden; }
.kal-wt { padding: 10px 8px; font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); text-align: center; background: var(--flaeche-2); }
.kal-tag { min-height: 116px; padding: 8px; background: var(--flaeche); cursor: pointer; overflow: hidden; transition: background .12s; }
.kal-tag:hover { background: var(--flaeche-hover); }
.kal-tag.fremd { background: var(--flaeche-2); color: var(--text-3); }
.kal-tag.heute .kal-nr { background: var(--akzent); color: #fff; }
.kal-nr { display: inline-grid; place-items: center; min-width: 26px; height: 26px; border-radius: 13px; font-size: 12px; font-weight: 700; margin-bottom: 4px; }
.kal-termin { font-size: 12px; padding: 4px 7px; border-radius: 6px; margin-bottom: 3px; background: color-mix(in srgb, var(--f) 16%, var(--flaeche)); border-left: 3px solid var(--f); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.mitarbeiter-legende { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; font-size: 13px; color: var(--text-2); }
.mitarbeiter-legende i, .chip i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
.mitarbeiter-wahl { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.chip { flex-direction: row; align-items: center; gap: 4px; border: 1px solid var(--rand); border-radius: 20px; padding: 7px 13px; margin: 0; cursor: pointer; color: var(--text); font-weight: 400; }
.chip input { width: auto; margin: 0 4px 0 0; accent-color: var(--akzent); }
.chip:has(input:checked) { border-color: var(--akzent); background: var(--akzent-weich); }

/* ---------- Dialoge & Meldungen ---------- */
.modal-bg { position: fixed; inset: 0; background: rgba(8, 8, 10, .5); backdrop-filter: blur(3px); display: grid; place-items: center; z-index: 100; padding: 16px; animation: einblenden .15s ease-out; }
.modal { background: var(--flaeche); border: 1px solid var(--rand); border-radius: 18px; width: min(620px, 100%); max-height: calc(100vh - 32px); overflow: auto; box-shadow: var(--schatten-hoch); animation: hochgleiten .18s ease-out; }
.modal-breit { width: min(900px, 100%); }
.modal-kopf { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; border-bottom: 1px solid var(--rand); position: sticky; top: 0; background: var(--flaeche); z-index: 1; }
.modal-kopf h3 { margin: 0; }
.modal-inhalt { padding: 22px; }
.frage { font-size: 15px; margin: 0; }
#toasts { position: fixed; right: 22px; bottom: 22px; display: flex; flex-direction: column; gap: 8px; z-index: 200; }
.toast { background: var(--hervor); color: var(--hervor-text); padding: 12px 16px; border-radius: 12px; box-shadow: var(--schatten-hoch); max-width: 380px; font-size: 13.5px; animation: hochgleiten .18s ease-out; }
.toast-fehler { background: var(--akzent); color: #fff; }
@keyframes einblenden { from { opacity: 0; } }
@keyframes hochgleiten { from { opacity: 0; transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- Druck / PDF ---------- */
#druckbereich, .pdf-holder { position: fixed; left: -10000px; top: 0; }
@media print {
  @page { size: A4; margin: 0; }
  body.druckt { display: block; background: #fff; }
  body.druckt > *:not(#druckbereich) { display: none !important; }
  body.druckt #druckbereich { position: static; }
}

/* ---------- Mobil ---------- */
@media (max-width: 1200px) {
  .editor-layout { grid-template-columns: 1fr; }
  .editor-vorschau { position: static; }
  .raster-buch { grid-template-columns: 1fr; }
}
@media (max-width: 860px) {
  body { grid-template-columns: 1fr; }
  .seitenleiste { position: fixed; left: 0; top: 0; z-index: 50; width: 264px; transform: translateX(-100%); transition: transform .2s; }
  body.menu-offen .seitenleiste { transform: none; box-shadow: var(--schatten-hoch); }
  .mobil-kopf { display: flex; gap: 12px; align-items: center; padding: 12px 16px; background: var(--seite); color: #fff; position: sticky; top: 0; z-index: 40; }
  .mobil-kopf .btn-icon { color: #fff; }
  .mobil-kopf svg { width: 22px; height: 22px; }
  main { padding: 20px 16px 64px; }
  h1 { font-size: 22px; }
  .raster-dash, .raster-2, .raster-3 { grid-template-columns: 1fr; }
  .span-2 { grid-column: auto; }
  .pos-tabelle thead { display: none; }
  .pos-tabelle tr { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; border-bottom: 1px solid var(--rand); padding: 8px 0; }
  .pos-tabelle td:nth-child(2) { grid-column: 1 / -1; order: -1; }
  .pos-griff { flex-direction: row; }
  .kal-tag { min-height: 72px; padding: 4px; }
  .kal-termin { font-size: 10px; padding: 2px 4px; }
  .tabelle { font-size: 13px; }
  .karte { padding: 16px; overflow-x: auto; }
  .tabs { width: 100%; }
}

/* Rechnungs-/Angebotsvorlage – A4 (210 × 297 mm). Farben kommen aus den Einstellungen. */
.doc-page {
  --d-farbe: #E53935;
  --d-akzent: #1F1F1F;
  width: 210mm;
  min-height: 297mm;
  background: #fff;
  color: #2B2B2B;
  font-family: var(--d-schrift), Montserrat, Arial, sans-serif;
  font-size: 9.5pt;
  line-height: 1.45;
  padding: 0 18mm 34mm;
  position: relative;
  box-sizing: border-box;
}
.doc-page * { box-sizing: border-box; }
.d-band { height: 7mm; background: var(--d-farbe); margin: 0 -18mm; }
.d-kopf { display: flex; justify-content: space-between; align-items: center; padding: 10mm 0 8mm; border-bottom: 1px solid #E6E6E6; }
.d-logo img { max-height: 22mm; max-width: 75mm; object-fit: contain; }
.d-firmenname { font-size: 20pt; font-weight: 800; color: var(--d-farbe); letter-spacing: -.01em; }
.d-titel-box { text-align: right; }
.d-titel { font-size: 22pt; font-weight: 800; color: var(--d-akzent); letter-spacing: .06em; line-height: 1.1; }
.d-nummer { font-size: 10pt; color: var(--d-farbe); font-weight: 700; margin-top: 2mm; }
.d-adressen { display: flex; justify-content: space-between; gap: 10mm; margin-top: 9mm; }
.d-absender { font-size: 7pt; color: #888; text-decoration: underline; margin-bottom: 3mm; }
.d-label { font-size: 7.5pt; letter-spacing: .08em; color: var(--d-farbe); font-weight: 700; margin-bottom: 1.5mm; }
.d-kunde { font-size: 10.5pt; line-height: 1.5; }
.d-infos { border-collapse: collapse; font-size: 9pt; align-self: flex-start; min-width: 62mm; }
.d-infos td { padding: 1.4mm 0; border-bottom: 1px solid #EFEFEF; }
.d-infos td:first-child { color: #777; padding-right: 8mm; }
.d-infos td:last-child { text-align: right; font-weight: 700; }
.d-felder { display: grid; grid-template-columns: 1fr 1fr; gap: 3mm 8mm; margin-top: 7mm; background: #F7F7F7; border-left: 3px solid var(--d-farbe); padding: 3.5mm 5mm; }
.d-felder span { display: block; font-size: 7pt; letter-spacing: .06em; color: #888; font-weight: 700; }
.d-betreff { font-size: 13pt; margin: 9mm 0 2mm; color: var(--d-akzent); font-weight: 700; }
.d-text { margin: 3mm 0; }
.d-positionen { width: 100%; border-collapse: collapse; margin-top: 5mm; }
.d-positionen th { background: var(--d-farbe); color: #fff; font-size: 8pt; letter-spacing: .05em; padding: 2.6mm 2.5mm; text-align: left; font-weight: 700; }
.d-positionen td { padding: 2.6mm 2.5mm; border-bottom: 1px solid #ECECEC; vertical-align: top; }
.d-positionen tbody tr:nth-child(even) td { background: #FAFAFA; }
.d-positionen .c-nr { width: 11mm; color: #888; }
.d-positionen .c-num { text-align: right; white-space: nowrap; }
.d-positionen .c-summe { font-weight: 700; }
.d-leer { color: #aaa; text-align: center; padding: 6mm !important; }
.d-summen-wrap { display: flex; justify-content: flex-end; margin-top: 3mm; }
.d-summen { border-collapse: collapse; min-width: 85mm; }
.d-summen td { padding: 1.6mm 2.5mm; }
.d-summen td:last-child { text-align: right; white-space: nowrap; }
.d-summen .d-gesamt td { background: var(--d-akzent); color: #fff; font-weight: 800; font-size: 11pt; padding: 3mm 2.5mm; }
.d-summen .d-gesamt td:last-child { color: #fff; }
.d-anzahlung { margin: 3mm 0 0 auto; width: 85mm; border: 1px solid var(--d-farbe); border-radius: 2mm; padding: 2mm 3mm; }
.d-anzahlung > div { display: flex; justify-content: space-between; padding: .8mm 0; }
.d-hinweis { font-size: 8.5pt; color: #555; margin-top: 5mm; font-style: italic; }
.d-bank { margin-top: 4mm; padding: 3mm 4mm; background: #F7F7F7; font-size: 8.5pt; border-radius: 1.5mm; }
.d-fuss { position: absolute; left: 0; right: 0; bottom: 0; padding: 5mm 18mm 7mm; border-top: 3px solid var(--d-farbe); display: flex; justify-content: space-between; gap: 5mm; font-size: 7pt; color: #666; line-height: 1.5; background: #fff; }
/* knapp unter A4-Höhe, damit keine leere Zusatzseite entsteht */
#druckbereich .doc-page { min-height: 294mm; }

/* ---------- Vorlage "Save Your Möbel" (nach Canva-Vorlage) ---------- */
.doc-page.v-syf { display: flex; flex-direction: column; padding: 0 0 10mm; font-size: 9.5pt; color: #1E1E1E; font-family: var(--d-schrift), Aileron, 'Helvetica Neue', Arial, sans-serif; }
.s-kopf { background: var(--d-kopf); color: #fff; height: 52mm; display: flex; justify-content: space-between; align-items: center; padding: 0 21mm 0 10mm; }
.s-logo img { height: 38mm; width: auto; max-width: 85mm; object-fit: contain; display: block; }
.s-logo span { font-size: 20pt; font-weight: 700; letter-spacing: .08em; }
.s-kontakt { text-align: right; font-size: 10.5pt; line-height: 1.45; margin-top: -6mm; }
.s-inhalt { padding: 13mm 21mm 0 24mm; }
.s-adressen { display: flex; justify-content: space-between; gap: 10mm; line-height: 1.5; }
.s-titel { font-weight: 700; margin-bottom: 2mm; }
.s-kunde b { font-weight: 700; }
.s-kunde { font-weight: 700; }
.s-meta { text-align: right; margin-top: 5mm; }
.s-felder { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5mm 8mm; margin-top: 6mm; font-size: 9pt; }
.s-felder span { display: block; font-size: 7.5pt; color: #6B6B6B; }
.s-betreff { font-size: 11pt; font-weight: 700; margin: 9mm 0 0; }
.s-text { margin: 3mm 0 0; }
.s-tabelle { width: 100%; border-collapse: collapse; margin-top: 16mm; }
.s-felder + .s-tabelle, .s-text + .s-tabelle { margin-top: 8mm; }
.s-tabelle th { text-align: left; font-weight: 700; padding: 3mm 0; border-top: .6mm solid #1E1E1E; border-bottom: .45mm solid #1E1E1E; }
.s-tabelle td { padding: 3.6mm 0; border-bottom: .25mm solid #51606E; font-size: 9pt; vertical-align: top; }
.s-tabelle .s-pos { width: 18mm; }
.s-tabelle .s-num { text-align: right; white-space: nowrap; padding-left: 4mm; }
.s-leer { color: #999; text-align: center !important; }
.s-summen { width: 44%; margin: 9mm 0 0 auto; }
.s-zeile { display: flex; justify-content: space-between; padding: 1.4mm 0; font-size: 9pt; }
.s-gesamt { display: flex; justify-content: space-between; font-weight: 700; font-size: 10.5pt; padding: 4mm 0; border-top: .6mm solid #1E1E1E; border-bottom: .6mm solid #1E1E1E; margin: 1mm 0; }
.s-schluss { font-size: 7.5pt; margin-top: 2mm; padding-left: 2mm; line-height: 1.5; }
.s-fuss { margin: auto 21mm 0 24mm; padding-top: 8mm; font-size: 9pt; line-height: 1.55; }
.s-steuer { font-size: 8.5pt; padding: 0 0 2mm 1mm; border-bottom: .3mm solid #444; }
.s-spalten { display: grid; grid-template-columns: 62mm 1fr; padding: 2mm 0 0 1.5mm; }


.demo-box { padding: 14px; border-radius: 12px; background: var(--seite-2); font-size: 12px; color: var(--seite-text); display: flex; flex-direction: column; gap: 8px; }
.demo-box b { color: var(--seite-text-hell); font-size: 13px; }
.demo-box .btn { background: transparent; color: var(--seite-text-hell); border-color: rgba(255, 255, 255, .16); white-space: normal; text-align: center; }
.demo-box .btn:hover { background: rgba(255, 255, 255, .08); }

<script>
// Grundfunktionen: API, Zustand, Formatierung, Berechnung, Rechnungsvorlage
const S = {
  settings: null,
  kunden: [],
  dokumente: [],
  buchungen: [],
  mitarbeiter: [],
  termine: []
};

async function api(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Fehler ${res.status}`);
  return data;
}

async function ladeAlles() {
  const [settings, kunden, dokumente, buchungen, mitarbeiter, termine] = await Promise.all([
    api('GET', '/api/settings'),
    api('GET', '/api/kunden'),
    api('GET', '/api/dokumente'),
    api('GET', '/api/buchungen'),
    api('GET', '/api/mitarbeiter'),
    api('GET', '/api/termine')
  ]);
  Object.assign(S, { settings, kunden, dokumente, buchungen, mitarbeiter, termine });
}

// Speichert ein Objekt (neu oder vorhanden) und aktualisiert den lokalen Zustand
async function speichere(col, item) {
  const saved = item.id ? await api('PUT', `/api/${col}/${item.id}`, item) : await api('POST', `/api/${col}`, item);
  const list = S[col];
  const i = list.findIndex((x) => x.id === saved.id);
  if (i >= 0) list[i] = saved;
  else list.push(saved);
  return saved;
}

async function loesche(col, id) {
  await api('DELETE', `/api/${col}/${id}`);
  S[col] = S[col].filter((x) => x.id !== id);
}

async function speichereEinstellungen() {
  S.settings = await api('PUT', '/api/settings', S.settings);
}

// ---------- Helfer ----------
// Kleiner Zwischenspeicher für Ansichts-Einstellungen (funktioniert auch, wenn der Browser Speicher blockiert)
const merker = (() => {
  const mem = {};
  return {
    get(k) { try { return sessionStorage.getItem(k); } catch { return mem[k] ?? null; } },
    set(k, v) { try { sessionStorage.setItem(k, v); } catch { mem[k] = String(v); } },
    del(k) { try { sessionStorage.removeItem(k); } catch { delete mem[k]; } }
  };
})();

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

function esc(v) {
  return String(v ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
const nl2br = (v) => esc(v).replace(/\n/g, '<br>');

const euroFmt = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' });
const euro = (n) => euroFmt.format(Number(n) || 0);
const zahl = (n, d = 2) => (Number(n) || 0).toLocaleString('de-DE', { minimumFractionDigits: 0, maximumFractionDigits: d });
const prozent = (n) => `${(Number(n) || 0).toLocaleString('de-DE', { maximumFractionDigits: 1 })} %`;
const r2 = (n) => Math.round((Number(n) + Number.EPSILON) * 100) / 100;

// Eingaben mit Komma erlauben: "1.234,50" -> 1234.5
function parseZahl(v) {
  if (typeof v === 'number') return v;
  let s = String(v || '').trim().replace(/\s|€|%/g, '');
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = parseFloat(s);
  return Number.isFinite(n) ? n : 0;
}

const heute = () => isoDatum(new Date());
function isoDatum(d) {
  const x = new Date(d);
  return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
}
function plusTage(iso, tage) {
  const d = new Date(`${iso}T12:00:00`);
  d.setDate(d.getDate() + Number(tage || 0));
  return isoDatum(d);
}
function datum(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.slice(0, 10).split('-');
  return `${d}.${m}.${y}`;
}
const MONATE = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
const MONATE_KURZ = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];

function toast(msg, typ = 'ok') {
  const el = document.createElement('div');
  el.className = `toast toast-${typ}`;
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), typ === 'fehler' ? 7000 : 3500);
}

// Einfaches Dialogfenster
function modal(titel, inhaltHtml, { breit = false, beimSchliessen } = {}) {
  const wrap = document.createElement('div');
  wrap.className = 'modal-bg';
  wrap.innerHTML = `<div class="modal ${breit ? 'modal-breit' : ''}">
    <div class="modal-kopf"><h3>${esc(titel)}</h3><button class="btn-icon" data-close title="Schließen">✕</button></div>
    <div class="modal-inhalt">${inhaltHtml}</div></div>`;
  const close = () => {
    if (!wrap.isConnected) return;
    wrap.remove();
    if (beimSchliessen) beimSchliessen();
  };
  wrap.addEventListener('mousedown', (e) => { if (e.target === wrap) close(); });
  $('[data-close]', wrap).onclick = close;
  document.body.appendChild(wrap);
  return { el: $('.modal', wrap), close };
}

// Rückfrage als eigener Dialog (Browser-Popups sind nicht überall erlaubt)
function bestaetigen(text, { ok = 'Ja, weiter', abbrechen = 'Abbrechen' } = {}) {
  return new Promise((resolve) => {
    let antwort = false;
    const { el, close } = modal('Bitte bestätigen', `<p class="frage">${esc(text)}</p>
      <div class="btn-gruppe rechts"><button class="btn" data-nein>${esc(abbrechen)}</button><button class="btn btn-primaer" data-ja>${esc(ok)}</button></div>`,
      { beimSchliessen: () => resolve(antwort) });
    $('[data-nein]', el).onclick = close;
    $('[data-ja]', el).onclick = () => { antwort = true; close(); };
    $('[data-ja]', el).focus();
  });
}

// ---------- Berechnung ----------
// Kleinunternehmer: Preise sind Endpreise, keine USt.
// Regelbesteuerung: Preise sind Netto, USt je Position.
function berechne(doc) {
  const klein = doc.steuerModus === 'klein';
  const rabatt = parseZahl(doc.rabattProzent);
  const faktor = 1 - rabatt / 100;
  let summePos = 0;
  const proSatz = {};
  const positionen = (doc.positionen || []).map((p) => {
    const betrag = r2(parseZahl(p.menge) * parseZahl(p.preis));
    summePos += betrag;
    const satz = klein ? 0 : parseZahl(p.ustSatz ?? 19);
    proSatz[satz] = (proSatz[satz] || 0) + betrag;
    return { ...p, betrag };
  });
  summePos = r2(summePos);
  positionen.forEach((p) => { p.anteil = summePos ? (p.betrag / summePos) * 100 : 0; });
  const rabattBetrag = r2(summePos - summePos * faktor);
  const netto = r2(summePos - rabattBetrag);
  const steuern = klein
    ? []
    : Object.keys(proSatz)
        .map(Number)
        .filter((s) => s > 0)
        .sort((a, b) => b - a)
        .map((satz) => {
          const basis = r2(proSatz[satz] * faktor);
          return { satz, basis, betrag: r2((basis * satz) / 100) };
        });
  const ust = r2(steuern.reduce((a, s) => a + s.betrag, 0));
  const brutto = r2(netto + ust);
  const anzahlungProzent = parseZahl(doc.anzahlungProzent);
  const anzahlung = r2((brutto * anzahlungProzent) / 100);
  return { positionen, summePos, rabatt, rabattBetrag, netto, steuern, ust, brutto, anzahlungProzent, anzahlung, rest: r2(brutto - anzahlung), klein };
}

// Platzhalter in Texten ersetzen
function platzhalter(text, doc) {
  const s = S.settings;
  const c = doc ? berechne(doc) : null;
  const map = {
    FIRMA: s.firma.name,
    KUNDE: doc ? doc.kunde?.name || '' : '',
    NUMMER: doc ? doc.nummer || '' : '',
    BETRAG: c ? euro(c.brutto) : '',
    DATUM: doc ? datum(doc.datum) : '',
    FAELLIG: doc ? datum(doc.faelligAm) : '',
    GUELTIG: doc ? datum(doc.gueltigBis) : '',
    ZIEL: doc && doc.datum && doc.faelligAm ? Math.round((new Date(doc.faelligAm) - new Date(doc.datum)) / 864e5) : s.zahlungszielTage,
    JAHR: new Date().getFullYear()
  };
  return String(text || '').replace(/\{([A-Z]+)\}/g, (m, k) => (k in map ? map[k] : m));
}

// ---------- Rechnungs-/Angebotsvorlagen (A4) ----------
function datumLang(iso) {
  if (!iso) return '';

// PDF aus der Vorlage erzeugen (im Browser, mit html2pdf.js)
async function dokumentPdf(doc) {
  const holder = document.createElement('div');
  holder.className = 'pdf-holder';
  holder.innerHTML = renderDokument(doc);
  // knapp unter A4-Höhe, sonst entsteht durch Rundung eine leere Zusatzseite
  holder.firstElementChild.style.minHeight = '294mm';
  document.body.appendChild(holder);
  try {
    const worker = html2pdf()
      .set({
        margin: 0,
        filename: dateiname(doc),
        image: { type: 'jpeg', quality: 0.95 },
        html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak: { mode: ['css', 'legacy'], avoid: ['tr', '.d-summen-wrap', '.d-anzahlung', '.s-summen'] }
      })
      .from(holder.firstElementChild);
    return await worker.outputPdf('blob');
  } finally {
    holder.remove();
  }
}

function dateiname(doc) {
  const art = doc.typ === 'rechnung' ? 'Rechnung' : 'Kostenvoranschlag';
  const kunde = (doc.kunde?.name || '').replace(/[^\wäöüÄÖÜß-]+/g, '_');
  return `${art}_${(doc.nummer || 'Entwurf').replace(/[^\w-]+/g, '_')}${kunde ? `_${kunde}` : ''}.pdf`;
}

function blobZuBase64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function drucken(html) {
  const area = $('#druckbereich');
  area.innerHTML = html;
  document.body.classList.add('druckt');
  window.print();
  document.body.classList.remove('druckt');
  area.innerHTML = '';
}

// A4-Vorschau an die verfügbare Breite anpassen
function skaliereVorschau(el) {
  const rahmen = el.parentElement;
  const passen = () => {
    const breite = rahmen.clientWidth - 32;
    const faktor = Math.min(1, breite / el.offsetWidth);
    el.style.transform = `scale(${faktor})`;
    el.style.height = `${el.scrollHeight}px`;
    rahmen.style.height = `${el.scrollHeight * faktor + 32}px`;
  };
  passen();
  if (!el._beobachter) {
    el._beobachter = new ResizeObserver(passen);
    el._beobachter.observe(rahmen);
  }
}

// Aus einem hochgeladenen Logo eine helle Variante für dunkle Flächen erzeugen:
// helle Hintergründe werden durchsichtig, dunkle Teile weiß, farbige (rote) Teile bleiben.
function logoVarianten(dataUrl) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const faktor = Math.min(1, 900 / Math.max(img.width, img.height));
      const w = Math.round(img.width * faktor);
      const h = Math.round(img.height * faktor);
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const quelle = ctx.getImageData(0, 0, w, h);
      const normal = ctx.createImageData(w, h);
      const hell = ctx.createImageData(w, h);
      const q = quelle.data;
      for (let i = 0; i < q.length; i += 4) {
        const [r, g, b, a] = [q[i], q[i + 1], q[i + 2], q[i + 3]];
        const farbig = Math.max(r, g, b) - Math.min(r, g, b) > 60;
        if (farbig) {
          normal.data.set([r, g, b, a], i);
          hell.data.set([r, g, b, a], i);
        } else {
          const lum = r * 0.299 + g * 0.587 + b * 0.114;
          const alpha = Math.round(Math.min(255, Math.max(0, (255 - lum) * 1.2)) * (a / 255));
          if (alpha < 12) continue;
          normal.data.set([r, g, b, alpha], i);
          hell.data.set([255, 255, 255, alpha], i);
        }
      }
      const zuUrl = (daten) => { ctx.clearRect(0, 0, w, h); ctx.putImageData(daten, 0, 0); return canvas.toDataURL('image/png'); };
      resolve({ normal: zuUrl(normal), hell: zuUrl(hell) });
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

// ---------- Ersatz für den Server ----------
async function api(method, url, body) {
  if (!demoDb) {
    demoDb = demoLaden() || demoBeispieldaten();
    demoDb.settings = demoMerge(window.DEMO_DEFAULTS, demoDb.settings || {});
    DEMO_COLS.forEach((c) => (demoDb[c] = demoDb[c] || []));
    demoSpeichern();
  }
  const teile = url.split('/').filter(Boolean);
  const antwort = (x) => kopie(x);

  if (url === '/api/settings') {
    if (method === 'PUT') {
      demoDb.settings = demoMerge(window.DEMO_DEFAULTS, body || {});
      demoSpeichern();
    }
    return antwort(demoDb.settings);
  }
  if (teile[0] === 'api' && teile[1] === 'nummer') {
    const cfg = demoDb.settings.nummern[teile[2]];
    const nummer = cfg.prefix.replace('{JAHR}', String(new Date().getFullYear())) + String(cfg.naechste).padStart(cfg.stellen || 1, '0');
    cfg.naechste += 1;
    demoSpeichern();
    return { nummer };
  }
  if (url.startsWith('/api-mail')) {
    throw new Error('In der Test-Version werden keine E-Mails verschickt. Im eigenen Portal mit Server geht die Mail mit PDF direkt an den Kunden.');
  }
  if (url === '/api-restore') {
    demoDb = { settings: demoMerge(window.DEMO_DEFAULTS, body.settings) };
    DEMO_COLS.forEach((c) => (demoDb[c] = Array.isArray(body[c]) ? body[c] : []));
    demoSpeichern();
    return { ok: true };
  }
  if (teile[0] === 'api' && DEMO_COLS.includes(teile[1])) {
    const list = demoDb[teile[1]];
    const id = teile[2];
    if (method === 'GET') return antwort(list);
    if (method === 'POST') {
      const item = { ...body, id: demoId(), erstellt: new Date().toISOString() };
      list.push(item);
      demoSpeichern();
      return antwort(item);
    }
    const i = list.findIndex((x) => x.id === id);
    if (i < 0) throw new Error('Nicht gefunden');
    if (method === 'PUT') {
      list[i] = { ...list[i], ...body, id, geaendert: new Date().toISOString() };
      demoSpeichern();
      return antwort(list[i]);
    }
    if (method === 'DELETE') {
      list.splice(i, 1);
      demoSpeichern();
      return { ok: true };
    }
  }
  throw new Error(`Unbekannte Anfrage: ${method} ${url}`);
}

const demoDownloads = window.claude?.use ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
async function download(blob, name) {
  const dl = await demoDownloads;
  if (!dl) return toast(`„${name}“ wurde erstellt. Herunterladen ist in dieser Ansicht nicht möglich.`);
  try {
    await dl.save({ filename: name, data: blob });
  } catch (e) {
    if (e?.code === 'declined') return;
    if (e?.code === 'rejected_extension') return toast('Dieses Dateiformat kann die Test-Version nicht speichern. Im eigenen Portal geht es.', 'fehler');
    if (e?.code === 'rate_limited') return toast('Bitte kurz warten und noch einmal versuchen.', 'fehler');
    toast('Herunterladen ist in dieser Ansicht nicht möglich.', 'fehler');
  }
}
