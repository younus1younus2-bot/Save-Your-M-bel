# Portal + Caddy (automatisches HTTPS) für einen eigenen Server (vServer).
# Optional: die Website (PHP) im eigenen, abgeschotteten Container – einrichten mit website-einrichten.sh.
# Start aus diesem Ordner: docker compose up -d --build
services:
  portal:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      TRUST_PROXY: '1'
    volumes:
      - ../data:/app/data
    expose:
      - '3000'
    networks:
      - intern

  # Website für Kunden: eigenes Netz ohne Verbindung zum Portal-Container, Dateien nur lesend, keine Datenbank.
  # Anfragen schickt sie wie jeder Besucher über die öffentliche Portal-Adresse (nur mit Website-Schlüssel).
  website:
    image: php:8.3-apache
    profiles: ['website']
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/apache2
      - /var/lock/apache2
    volumes:
      - /opt/save-your-moebel/website:/var/www/html:ro
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    expose:
      - '80'
    networks:
      - web

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: ../.env
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-extra:/etc/caddy/extra:ro
      - caddy_daten:/data
      - caddy_config:/config
    depends_on:
      - portal
    networks:
      - intern
      - web

networks:
  intern:
  web:

volumes:
  caddy_daten:
  caddy_config:
