# Jede Website-Version liegt in /var/www/versionen/_v/<name>. Welche Version Besucher sehen, steht in
# /etc/website-steuerung/aktiv.txt (Zeile „version <name>“) – das Portal schreibt diese Datei.
# Vorschau: https://domain/?vorschau=<name> (merkt sich die Version 2 Stunden), beenden mit ?vorschau=aus
ServerTokens Prod
ServerSignature Off
<VirtualHost *:80>
    DocumentRoot /var/www/versionen
    DirectoryIndex index.php index.html
    <Directory /var/www/versionen>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    <FilesMatch "^_version\.json$">
        Require all denied
    </FilesMatch>
    php_value auto_prepend_file /usr/local/lib/sym/vorschau.php

    RewriteEngine On
    RewriteMap aktiv "txt:/etc/website-steuerung/aktiv.txt"

    # Versionsordner sind von außen nicht direkt aufrufbar
    RewriteCond %{THE_REQUEST} \s/+_v(/|\s|\?)
    RewriteRule ^ - [F]
    # Bereits zugeordnete Adressen (z. B. index.php-Suche von mod_dir) nicht noch einmal auswerten
    RewriteCond %{REQUEST_URI} ^/_v/
    RewriteRule ^ - [L]

    # Vorschau-Wunsch aus ?vorschau=… (setzt Cookie) oder aus dem Cookie
    RewriteCond %{QUERY_STRING} (?:^|&)vorschau=([a-z0-9-]{1,40})(?:&|$)
    RewriteRule ^ - [E=SYM_WUNSCH:%1,CO=sym_vorschau:%1:%{HTTP_HOST}:120:/:secure:httponly]
    RewriteCond %{ENV:SYM_WUNSCH} ^$
    RewriteCond %{HTTP_COOKIE} (?:^|;\s*)sym_vorschau=([a-z0-9-]{1,40})
    RewriteRule ^ - [E=SYM_WUNSCH:%1]
    # Nur Versionen, die es wirklich gibt – sonst gilt die aktive Version
    RewriteCond %{ENV:SYM_WUNSCH} !^$
    RewriteCond /var/www/versionen/_v/%{ENV:SYM_WUNSCH} -d
    RewriteRule ^ - [E=SYM_VER:%{ENV:SYM_WUNSCH},E=SYM_VORSCHAU:%{ENV:SYM_WUNSCH}]
    RewriteCond %{ENV:SYM_VORSCHAU} ^$
    RewriteRule ^ - [E=SYM_VER:${aktiv:version|v1}]

    RewriteCond %{REQUEST_URI} !^/_v/
    RewriteRule ^/(.*)$ /_v/%{ENV:SYM_VER}/$1 [L]
</VirtualHost>
